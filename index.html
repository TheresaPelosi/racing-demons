<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Demons</title>
    <!--    Cards icon from https://icons8.com -->
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="controls">
        <label for="difficulty">Bot Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
        </select>
        <button id="start-btn">Start Game</button>
    </div>
    <div id="round-info">Round: 0 / 5</div>
    <div id="scoreboard">
        <span>You: <strong id="score-player">0</strong></span>
        <span>Derek: <strong id="score-bot1">0</strong></span>
        <span>Kiera: <strong id="score-bot2">0</strong></span>
        <span>Tina: <strong id="score-bot3">0</strong></span>
    </div>
</header>

<div id="status-bar">
    <span id="message-banner"> </span>
    <button id="ready-btn">Ready</button>
</div>

<div class="bot-status-bar">
    <div class="bot-box" id="bot-box-bot1"><strong>Derek</strong><br>Cards left: <span id="bot1-demon">13</span></div>
    <div class="bot-box" id="bot-box-bot2"><strong>Kiera</strong><br>Cards left: <span id="bot2-demon">13</span></div>
    <div class="bot-box" id="bot-box-bot3"><strong>Tina</strong><br>Cards left: <span id="bot3-demon">13</span></div>
</div>

<div id="center-area">
    <div class="center-placeholder">Drag Aces here to start center piles</div>
</div>

<div id="player-area">
    <div id="out-overlay">OUT!</div>

    <div class="top-player-row">
        <div class="slot">
            <div class="slot-label">(<span id="demon-count">0</span>)</div>
            <div class="card-slot" id="demon-slot"></div>
        </div>

        <div class="slot">
            <div class="slot-label"></div>
            <div class="card-row" id="tableau-slots">
                <div class="card-slot" data-slot="0"></div>
                <div class="card-slot" data-slot="1"></div>
                <div class="card-slot" data-slot="2"></div>
                <div class="card-slot" data-slot="3"></div>
            </div>
        </div>
    </div>

    <div class="bottom-player-row">
        <div class="slot">
            <div class="slot-label"></div>
            <div class="card-row">
                <div class="card-slot" id="stock-slot"></div>
                <div class="card-slot" id="flipped-slot"></div>
            </div>
        </div>
    </div>
</div>

<script src="index.js" type="module"></script>
</body>
</html>
